<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Form</title>
</head>
<body style="text-align:center; background-color:lightgray;">
    <h2>Infosys Regestration Form</h2>
    <form>
        <fieldset>
            <legend>College Information</legend>
            <br>
        
        <label for="ut">College name:</label>
        <input type="text" id="ut" placeholder="Enter college name..." required><br><br>
        <label for="un">Branch:</label>
        <select id="un" required>
            <option value="">Select branch</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="MECH">MECH</option>
            <option value="CIVIL">CIVIL</option></select><br><br>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter name..." name="name"><br><br>
        <label for="usn">USN:</label>
        <input type="text" id="usn" placeholder="Enter USN..." name="usn" required><br><br>
        <label for="percentage"> CGPA:</label>
        <input type="number" id="percentage" placeholder="Enter  CGPA... " required title><br><br>
        <label for="na">Graduation Year:</label>
        <input type="number" id="na"><br><br>
        <label for="ul">Current Backlog:</label>
        <input type="number" id="ul" required title><br><br>
        <label for="us">Academic gap:</label>
        <input type="number" id="us" required title><br><br>
        </fieldset>
         <br>
         <br>
        <fieldset>
            <legend>Personal Information</legend>
            <br>
            <label for="ae">First Name:</label>
            <input type="text" id="ae" placeholder="Enter name..." name="Firsttname"><br><br>
        <label for="ame">Last Name:</label>
        <input type="text" id="ame" placeholder="Enter name..." name="lastname"><br><br>
        <label for="ake">Email:</label>
        <input type="text" id="ake" placeholder="Enter email..." name="email" required><br><br>
        <label for="em">Password:</label>
        <input type="password" id="em" placeholder="Enter password..." name="Enter_password" required><br><br>
        <label for="me">confirm password:</label>
        <input type="password" id="me" placeholder="Enter password..." name="confirm_password" required><br><br>
        <label for="ue">Phone Number:</label>
        <input type="tel" id="ue" placeholder="Enter phone number..." required title>
       </fieldset>
        <br>
        <br>
        <fieldset>
            <legend>SSLC Details</legend><br>
        <label for="marks">SSLC Percentage:</label>
        <input type="number" id="marks" placeholder="Enter  sslc percentage %"  required title><br><br>
        <label for="nam">Year Of Passing:</label>
        <input type="number" id="nam" ><br><br>
        </fieldset>
         <br>
         <br>
        <fieldset>
        <legend>Puc Details</legend><br>
        <label for="uu">PUC Percentage:</label>
        <input type="number" id="uu" placeholder="Enter  puc percentage %" required title><br><br>
        <label for="nm">Year Of Passing:</label>
        <input type="number" id="nm"><br><br>
        </fieldset>
        <br>
        <br>
        <fieldset>
            <legend>Other Details</legend><br>
        <label>Gender:</label> <br><br>
        <input type="radio" name="option" value="Male">Male<br><br>
        <input type="radio" name="option" value="Female">Female<br><br>
        <input type="radio" name="option" value="Other">Other<br><br>
        </fieldset> <br><br>       
         <input type="submit">  &nbsp; &nbsp; &nbsp; 
        <button type="reset">Cancel</button>
    </form>
</body>
</html>
